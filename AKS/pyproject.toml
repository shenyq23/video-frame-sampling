[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aks-sampling-core"
version = "0.1.0"
description = "Adaptive Keyframe Sampling core used by the AKS repository"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[tool.setuptools]
py-modules = ["aks_core"]
